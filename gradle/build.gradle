plugins {
    id 'java'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.micronaut:micronaut-http-client:3.9.3'
    implementation 'io.quarkus:quarkus-core:3.1.0.Final'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okio:okio:3.3.0'
    implementation 'io.netty:netty-all:4.1.93.Final'
    implementation 'org.eclipse.jetty:jetty-server:11.0.15'
    implementation 'io.vertx:vertx-core:4.4.3'
    implementation 'org.jooq:jooq:3.18.4'
    implementation 'com.querydsl:querydsl-core:5.0.0'
    implementation 'org.mybatis:mybatis:3.5.13'
    implementation 'org.flywaydb:flyway-core:9.19.4'
    implementation 'org.liquibase:liquibase-core:4.22.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.6'
    implementation 'org.ehcache:ehcache:3.10.8'
    implementation 'io.micrometer:micrometer-core:1.11.1'
    implementation 'io.opentelemetry:opentelemetry-api:1.27.0'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.31'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
}

test {
    useJUnitPlatform()
}
